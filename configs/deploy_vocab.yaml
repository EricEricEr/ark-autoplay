# 部署目标词表（datapipe v1）：Deploy 动作里非干员名的形式化分类数据。
#
# 背景：prts.plus（MAA copilot）作业的 Deploy 动作 target 是自由文本。除真实干员名外，
# 社区作业还大量使用三类非干员名，v1 将其形式化为 action subtype（实现见
# src/ark_core/datapipe/deploy_vocab.py）：
#   1. device        —— 关卡装置 / 干员召唤物（token），本文件 devices 列表收录；
#   2. category      —— 类别通配占位符（“奶盾”“单奶”…），categories 小节给出
#                       中文词 → {profession, sub_hint, position_hint?} 的映射；
#   3. unknown_name  —— 词表之外的名字，转换时计数并保留原文。
#
# TODO(M1): 从本机 level_*.json（关卡文件 token 列表）自动扩充 devices，
# 把 unknown_name 长尾（当前约 2.6k 个低频名）中的真装置批量吸收进来；
# categories 维持人工维护的小词表，不做自动扩充。

vocab_version: "0.1.0"

# 别名：作业里的写法 → 官方干员名（解析时先按别名改写，再走干员名解析）
aliases:
  麒麟X夜刀: 麒麟R夜刀 # 官方名为 麒麟R夜刀（char_1029_yato2），社区常写作 X

