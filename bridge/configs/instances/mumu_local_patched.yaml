# MuMu 12 实例定义 —— 使用【打过补丁的 MaaCore】（含战场状态回调）
#
# 与 mumu_local.yaml 的唯一区别是 maa_dir 指向 patched 运行时：
#   MaaCore.dll 为本项目自建（bridge/maacore/_src/build/bin/Release/MaaCore.dll，
#   含 patches/0001-battle-state-callback.patch），resource/ 取自**同一上游 commit**，
#   其余 DLL 与官方 v6.18.0 发行版一致。
# 官方目录**零改动**（本运行时是独立目录，非覆盖）。
#
# 重建方法见 bridge/maacore/UPSTREAM.json 的「重建步骤」。
# 何时用它：需要采集战场状态（费用/击杀/待部署栏/已部署干员）跑数据工厂时。
# 何时不用：只回放不采状态时用 mumu_local.yaml 即可。
#
# ⚠️ 版本一致性红线：MaaCore.dll 与 resource/ **必须来自同一上游 commit**。
# 实测教训：dev-v2 代码 + v6.18.0 官方 resource 会因
# resource/roguelike/BlackFlow/strategy.json 的 schema_version 不匹配
# （代码要 15、官方是 14）导致 AsstLoadResource 返回 false，驱动直接加载失败。

name: mumu-local-patched
adb_host: 127.0.0.1
adb_port: 16416          # MuMu 12 本实例 ADB 端口
adb_aliases: [ 7555 ]    # 同一实例亦监听 7555（MuMu 兼容别名）
resolution:
  width: 1920
  height: 1080
dpi: 320
# MuMu 12 安装目录自带 adb（本机路径）
adb_path: E:/Program Files/Netease/MuMu/nx_main/adb.exe
# patched MAA 运行时（本机路径；由 maacore 构建产物 + 官方发行版其余文件组装）
maa_dir: E:/dev/maa_runtime_patched
maa_version: dev-v2+a82a0e13+battlestate
