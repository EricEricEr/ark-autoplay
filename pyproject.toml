# ark-autoplay-core 构建与工具链配置
# 依赖管理使用 uv（见 AGENTS.md）；本文件改动若涉及命令，须同步更新 AGENTS.md 与 CI。

[project]
name = "ark-core"
version = "0.1.0"
description = "明日方舟自主作战 AI 核心仓库：协议 / 感知 / 决策模型 / 训练 / 评测"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "EricEricEr" }]
dependencies = ["pydantic>=2", "pyarrow>=15", "pyyaml>=6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ark_core"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
