name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    name: ruff + pyright + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: 类型检查
        run: uv run pyright

      - name: 测试
        run: uv run pytest
