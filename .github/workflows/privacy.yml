name: privacy-path-check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  current-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the personal-path checker
        run: python -m unittest discover -s tests -p test_private_paths.py
      - name: Check the committed snapshot
        run: python scripts/check_private_paths.py
