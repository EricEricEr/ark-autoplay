# MuMu 采集实例模板：复制为 collector.local.yaml 后按本机填写。
# 端口用本机实例的实际值；路径用正斜杠，避免 YAML 转义问题。
name: collector
adb_host: 127.0.0.1
adb_port: 16384         # 示例值，不代表所有实例都用此端口
resolution:
  width: 1920
  height: 1080
dpi: 320
adb_path: ''  # 填写你自行选择的MuMu安装目录内的adb.exe完整路径。
# 当前工厂有目录名护栏：路径中须含 maa_runtime_patched。
# 名称本身不能证明 DLL 已打补丁；须用 maacore/README.md 的配套运行时。
maa_dir: ''  # 填写你自行选择的配套maa_runtime_patched完整路径。
maa_version: dev-v2+a82a0e13+runtime-patch
resource_policy:
  # 所有采集者默认禁止；不得继承维护者自抽号的源石授权。
  # 只有该账号所有者明确同意后才可在本地副本设为 true。
  allow_originite: false
  # 理智药同样按账号授权，缺项默认为 false。
  allow_medicine: false
